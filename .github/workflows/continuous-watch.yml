name: continuous-watch
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
jobs:
  retrigger-stuck:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Re-trigger stuck agent-task issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Checking for open agent-task issues with no linked PR..."
          OPEN_ISSUES=$(gh issue list --repo "$REPO" --label agent-task --state open --json number,title --limit 50)
          echo "Open issues: $OPEN_ISSUES"
          
          echo "$OPEN_ISSUES" | jq -r '.[].number' | while read ISSUE_NUM; do
            # Check if there's already a claude/ branch for this issue
            BRANCH_EXISTS=$(gh api repos/$REPO/git/refs --jq ".[].ref" 2>/dev/null | grep "claude/issue-${ISSUE_NUM}-" | head -1)
            
            if [ -z "$BRANCH_EXISTS" ]; then
              echo "Issue #${ISSUE_NUM} has no claude/ branch — re-triggering..."
              gh issue comment "$ISSUE_NUM" --repo "$REPO" --body "@claude Please implement this issue. Create the required files, commit them to a new branch named `claude/issue-${ISSUE_NUM}`, and open a PR. Be direct and execute immediately."
              echo "Triggered issue #${ISSUE_NUM}"
              sleep 5
            else
              echo "Issue #${ISSUE_NUM} already has branch: $BRANCH_EXISTS — skipping"
            fi
          done
          echo "Done."
