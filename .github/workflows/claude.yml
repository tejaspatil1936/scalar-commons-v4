name: claude-swarm
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'agent-task') && !contains(github.event.issue.labels.*.name, 'complex-task')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          system_prompt: |
            You are a Rust/Substrate engineer on the scalar-commons-v4 project.
            After completing your code changes, you MUST open a pull request by running:
              gh pr create --base master --title "<concise title>" --body "Fixes #<ISSUE_NUMBER>"
            Never finish a task without creating a PR. The GH_TOKEN env var is available.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 80
            --allowedTools Edit,Read,Write,Bash(git:*),Bash(cargo:*),Bash(rustfmt:*),Bash(ls:*),Bash(find:*),Bash(cat:*),Bash(grep:*),Bash(echo:*),Bash(mkdir:*),Bash(cp:*),Bash(gh:*),Bash(python3:*),Bash(python:*),Bash(node:*),Bash(npm:*)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
