[package]
name = "pallet-oracle"
version = "4.0.0"
edition = "2021"

[dependencies]
parity-scale-codec = { version = "3.6.12", default-features = false, features = ["derive"] }
scale-info = { version = "2.11", default-features = false, features = ["derive"] }
frame-support = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
frame-system = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
sp-std = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
# sp-io: hashing::blake2_256 for question/outcome commitment hashes
# (lib.rs:278,378,428).
sp-io = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
pallet-agents = { path = "../agents", default-features = false }
# pallet-escrow: oracle re-exports the DisputeOracle/DisputeCallback traits and
# the PROVIDER_WINS preimage constant it resolves disputes against
# (lib.rs:466-468). escrow does not depend on oracle, so this is acyclic.
pallet-escrow = { path = "../escrow", default-features = false }
frame-benchmarking = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false, optional = true }

[features]
default = ["std"]
std = ["pallet-agents/std","pallet-escrow/std","parity-scale-codec/std","scale-info/std","frame-support/std","frame-system/std","sp-runtime/std","sp-std/std","sp-io/std","frame-benchmarking?/std"]
runtime-benchmarks = ["frame-support/runtime-benchmarks","frame-system/runtime-benchmarks","frame-benchmarking/runtime-benchmarks"]
try-runtime = ["frame-support/try-runtime","frame-system/try-runtime"]
