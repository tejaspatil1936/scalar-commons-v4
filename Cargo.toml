[workspace]
members = [
    "node",
    "runtime",
    "pallets/agents",
    "pallets/escrow",
    "pallets/oracle",
    "pallets/emissions",
    "pallets/auto-params",
    "pallets/orchestrator",
    "pallets/constitution",
    "tests",
]
resolver = "2"

# ─── Polkadot SDK 2025.12 — all versions pinned explicitly ───────────────────
# sp-core 39.0.0, frame-system 45.0.0, sp-runtime 45.0.0
# Never use wildcard versions. Never upgrade without checking all dependents.
# Run `cargo tree --duplicates` after any version change.

[workspace.dependencies]
# ── Substrate primitives ──────────────────────────────────────────────────────
sp-core = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503",  default-features = false }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503",  default-features = false }
sp-io = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503",  default-features = false }
sp-std = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503",  default-features = false }
sp-arithmetic = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503",  default-features = false }
sp-weights = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503",  default-features = false }
sp-inherents = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503",  default-features = false }
sp-consensus-babe = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
sp-consensus-grandpa = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
